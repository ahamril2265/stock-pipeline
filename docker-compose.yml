services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,mntr"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | bash -c 'exec 3<>/dev/tcp/localhost/2181; echo ruok >&3; cat <&3' | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: unless-stopped

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 20s
      timeout: 10s
      retries: 6
  
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 20s
      timeout: 5s
      retries: 5

  spark-master:
     build:
      context: .
      dockerfile: Dockerfile.spark-master
     container_name: spark-master
     environment:

       - INIT_DAEMON_STEP=setup_spark
     restart: unless-stopped
     ports:
       - "8080:8080"
       - "7077:7077"
     volumes:
       - ./spark:/opt/spark/work-dir
       - ./spark/conf/spark-defaults.conf:/spark/conf/spark-defaults.conf
     healthcheck:
       test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
       interval: 20s
       timeout: 5s
       retries: 5

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark-worker
    container_name: spark-worker
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./spark/conf/spark-defaults.conf:/spark/conf/spark-defaults.conf

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: stockdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d stockdb"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myminio http://minio:9000 admin admin123;
      mc mb myminio/stock-data --ignore-existing;
      mc mb myminio/checkpoints --ignore-existing;
      exit 0;
      "
  
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: stock_analytics
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
  
  airflow-init:
    build:
      context: ./airflow

    container_name: airflow-init
    user: "50000:0"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/stockdb

    command:
      - bash
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com

    volumes:
      - ./airflow/dags:/opt/airflow/dags

  airflow-webserver:
    build:
      context: ./airflow

    container_name: airflow-webserver
    user: "0:0"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

    ports:
      - "8088:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/stockdb
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    command: webserver

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/project
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

  airflow-scheduler:
    build:
      context: ./airflow

    container_name: airflow-scheduler
    user: "0:0"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/stockdb
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    command: scheduler

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/project
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
  
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer

    container_name: producer

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

    stop_signal: SIGTERM
    stop_grace_period: 30s

    volumes:
      - ./:/app

    working_dir: /app

    command: python producer/unified_avro_producer.py

  bronze-stream:
    image: stock-pipeline-spark-master

    container_name: bronze-stream

    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped

    stop_signal: SIGTERM
    stop_grace_period: 60s

    volumes:
      - ./spark:/opt/spark/work-dir
      - ./spark/conf:/spark/conf
      - ./scripts:/scripts

    command: ["/bin/bash", "/scripts/start_bronze.sh"]

  dashboard:
    build:
      context: ./dashboard

    container_name: dashboard

    depends_on:
      clickhouse:
        condition: service_healthy

    ports:
      - "8501:8501"

    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: stock_analytics
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: stockdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      MINIO_HOST: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1g
    cpus: 1

volumes:
   minio_data:
   postgres_data:
   zookeeper_data:
   zookeeper_log:
